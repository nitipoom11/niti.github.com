<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="เว็บไซต์แสดงผลงานและทักษะของ Nitipoom">
    <title>ความภาคภูมิใจของ NITIPOOM</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Mitr:wght@300;500&family=Sarabun:wght@300;400;600&display=swap');

        /* ตั้งค่าธีมสีม่วงพาสเทลเท่ๆ (Dark Pastel Theme) */
        :root {
            --bg-dark-purple: #1e1b29;      /* สีม่วงเข้มพื้นหลัง */
            --pastel-purple: #d1c4e9;       /* สีม่วงพาสเทลสว่าง */
            --pastel-violet: #b39ddb;       /* สีม่วงพาสเทลกลาง */
            --pastel-pink: #f8bbd0;          /* สีชมพูพาสเทลสำหรับตัดขอบ */
            --text-light: #f5f5f7;          /* สีตัวอักษรหลัก */
            --card-bg: rgba(255, 255, 255, 0.05); /* กล่องกระจกโปร่งแสง */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            background-color: var(--bg-dark-purple);
            color: var(--text-light);
            line-height: 1.6;
            /* ลูกเล่นไล่เฉดสีม่วง-ชมพูจางๆ ที่พื้นหลัง */
            background-image: radial-gradient(circle at 80% 20%, rgba(179, 157, 219, 0.15) 0%, transparent 50%),
                              radial-gradient(circle at 20% 80%, rgba(248, 187, 208, 0.1) 0%, transparent 50%);
            background-attachment: fixed;
            padding: 0 1rem;
        }

        h1, h2, h3 {
            font-family: 'Mitr', sans-serif;
            color: var(--pastel-purple);
            font-weight: 500;
        }

        /* ส่วนหัวของเว็บ (Header) */
        header {
            text-align: center;
            padding: 5rem 1rem 3rem 1rem;
        }

        header h1 {
            font-size: 2.8rem;
            margin-bottom: 0.5rem;
            color: #fff;
            /* เอฟเฟกต์อักษรเรืองแสง */
            text-shadow: 0 0 10px rgba(179, 157, 219, 0.6), 0 0 20px rgba(179, 157, 219, 0.4);
        }

        header p {
            font-size: 1.2rem;
            color: var(--pastel-violet);
        }

        /* รูปแบบของกล่องข้อความ (Sections) */
        section {
            max-width: 800px;
            margin: 2rem auto;
            padding: 2rem;
            background: var(--card-bg);
            border-radius: 16px;
            backdrop-filter: blur(10px); /* เอฟเฟกต์กระจกฝ้า */
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        section h2 {
            font-size: 1.8rem;
            margin-bottom: 1rem;
            border-bottom: 2px solid rgba(179, 157, 219, 0.3);
            padding-bottom: 0.5rem;
            display: inline-block;
        }
